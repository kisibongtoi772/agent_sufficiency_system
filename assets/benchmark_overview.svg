<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
<rect width="1440" height="860" fill="white"/>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
.h1{font-size:34px;font-weight:800}.sub{font-size:16px;fill:#667085}.h2{font-size:23px;font-weight:750}.h3{font-size:16px;font-weight:650}.lab{font-size:14px}.val{font-size:14px;font-weight:700}.metric{font-size:27px;font-weight:750}.small{font-size:12px;fill:#667085}.box{fill:#f7f9fc;stroke:#d8dee8}.bar{fill:#3976b9}.strong{fill:#6d5bd0}.green{fill:#147a52}
</style>
<text x="58" y="58" class="h1">Agent Sufficiency System</text>
<text x="58" y="87" class="sub">Minimum context + maximum capability reuse + minimum net-new reasoning</text>
<line x1="58" y1="112" x2="1382" y2="112" stroke="#d8dee8"/>

<text x="58" y="155" class="h2">1. Context Sufficiency</text>
<text x="58" y="184" class="h3">Mean estimated input context / turn</text>

<text x="58" y="226" class="lab">Raw grep/read</text>
<rect x="223" y="208" width="350" height="24" rx="3" class="bar"/><text x="583" y="226" class="val">25,953</text>
<text x="58" y="269" class="lab">Graph retrieval</text>
<rect x="223" y="251" width="247" height="24" rx="3" class="bar"/><text x="480" y="269" class="val">18,295</text>
<text x="58" y="312" class="lab">Compact + lazy</text>
<rect x="223" y="294" width="121" height="24" rx="3" class="bar"/><text x="354" y="312" class="val">8,984</text>
<text x="58" y="355" class="lab">Token-min hybrid</text>
<rect x="223" y="337" width="42" height="24" rx="3" class="strong"/><text x="275" y="355" class="val">3,151</text>

<rect x="58" y="390" width="245" height="78" rx="14" class="box"/><text x="76" y="424" class="metric" fill="#215e9c">87.9%</text><text x="76" y="448" class="small">less mean context</text>
<rect x="320" y="390" width="245" height="78" rx="14" class="box"/><text x="338" y="424" class="metric" fill="#215e9c">91.1%</text><text x="338" y="448" class="small">lower P95 context</text>
<rect x="582" y="390" width="120" height="78" rx="14" class="box"/><text x="600" y="424" class="metric green">100%</text><text x="600" y="448" class="small">target coverage</text>

<text x="760" y="155" class="h2">2. Capability Sufficiency</text>
<text x="760" y="184" class="h3">Net-new implementations / 120 requests</text>
<text x="760" y="226" class="lab">Build every time</text>
<rect x="925" y="208" width="360" height="24" rx="3" class="bar"/><text x="1295" y="226" class="val">120</text>
<text x="760" y="269" class="lab">Search-first stateless</text>
<rect x="925" y="251" width="96" height="24" rx="3" class="bar"/><text x="1031" y="269" class="val">32</text>
<text x="760" y="312" class="lab">Build cache</text>
<rect x="925" y="294" width="24" height="24" rx="3" class="bar"/><text x="959" y="312" class="val">8</text>
<text x="760" y="355" class="lab">Search-first learning</text>
<rect x="925" y="337" width="24" height="24" rx="3" class="strong"/><text x="959" y="355" class="val">8</text>

<text x="760" y="390" class="h3">Implementation-work proxy</text>
<text x="760" y="432" class="lab">Build every time</text>
<rect x="925" y="414" width="360" height="24" rx="3" class="bar"/><text x="1295" y="432" class="val">233,180</text>
<text x="760" y="470" class="lab">Search-first stateless</text>
<rect x="925" y="452" width="117" height="24" rx="3" class="bar"/><text x="1052" y="470" class="val">75,940</text>
<text x="760" y="508" class="lab">Build cache</text>
<rect x="925" y="490" width="48" height="24" rx="3" class="bar"/><text x="983" y="508" class="val">31,366</text>
<text x="760" y="546" class="lab">Search-first learning</text>
<rect x="925" y="528" width="48" height="24" rx="3" class="strong"/><text x="983" y="546" class="val">30,811</text>

<rect x="760" y="575" width="245" height="78" rx="14" class="box"/><text x="778" y="609" class="metric green">93.3%</text><text x="778" y="633" class="small">fewer new implementations</text>
<rect x="1022" y="575" width="245" height="78" rx="14" class="box"/><text x="1040" y="609" class="metric green">75.0%</text><text x="1040" y="633" class="small">requests resolved from cache</text>

<line x1="58" y1="682" x2="1382" y2="682" stroke="#d8dee8"/>
<text x="58" y="726" class="h2">Architecture</text>
<rect x="58" y="748" width="102" height="56" rx="10" class="box"/><text x="109" y="782" text-anchor="middle" class="val">Task</text>
<text x="180" y="782" class="h2" fill="#667085">→</text>
<rect x="202" y="748" width="225" height="56" rx="10" class="box"/><text x="314" y="782" text-anchor="middle" class="val">Capability Resolver</text>
<text x="446" y="782" class="h2" fill="#667085">→</text>
<rect x="470" y="748" width="205" height="56" rx="10" class="box"/><text x="572" y="782" text-anchor="middle" class="val">Context Compiler</text>
<text x="693" y="782" class="h2" fill="#667085">→</text>
<rect x="718" y="748" width="290" height="56" rx="10" class="box"/><text x="863" y="782" text-anchor="middle" class="val">Minimum Sufficient Context</text>
<text x="1025" y="782" class="h2" fill="#667085">→</text>
<rect x="1050" y="748" width="185" height="56" rx="10" class="box"/><text x="1142" y="782" text-anchor="middle" class="val">LLM / Agent</text>

<text x="58" y="838" class="small">Generated from results/results.json and results/capability_reuse/results.json</text>
<text x="1382" y="838" text-anchor="end" class="small">github.com/kisibongtoi772/agent_sufficiency_system</text>
</svg>