[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sufficiency-system"
version = "0.1.0"
description = "A compact research prototype for measuring and reducing agent context overhead."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
benchmark = [
  "networkx>=3.0",
  "tiktoken>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
